[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060
[softphone]            ; register Zoiper/MicroSIP: user softphone / pass softpass
type=endpoint
context=from-sip
disallow=all
allow=ulaw,alaw
auth=softphone-auth
aors=softphone
[softphone-auth]
type=auth
auth_type=userpass
username=softphone
password=softpass
[softphone]
type=aor
max_contacts=1
